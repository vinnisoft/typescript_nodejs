<div class="flex justify-content-between align-items-center mb-2">
  <div class="flex gap-2 align-items-center">
    <i
      class="pi pi-arrow-left cursor-pointer"
      [routerLink]="['/companies']"
    ></i>
    <span class="text-xl font-semibold"> Upload CSV File </span>
  </div>
  <app-companies-redirection />
</div>

<div class="bg-lightest-color border-round-lg p-4">
  <bulk-data-upload
    label="Upload Companies"
    [accept]="'.csv'"
    (csvDataChange)="getCsvData($event)"
    [countries]="countries"
  />
  <div class="flex justify-content-between align-items-center">
    @if(tableColumns.length) {
    <p class="subheading font-bold">Companies Details</p>
    }@else {
    <span>&nbsp;</span>
    }
    <a
      class="text-sm text-primary"
      href="assets/files/company-bulk-upload-sample.csv"
      >Download Sample File</a
    >
  </div>
  @if(tableColumns.length) {
  <app-table
    [columns]="tableColumns"
    [data]="{ list: csvData }"
    [showHeaderButtons]="false"
  ></app-table>
  <div class="flex justify-content-end gap-2 mt-3">
    <app-custom-button
      type="submit"
      [label]="'Approve'"
      [loading]="loading"
      [disabled]="isInvalidData"
      [loading]="loading"
      (onClick)="onApprove()"
    />
    <app-custom-button
      [label]="'Cancel'"
      styleClass="bg-gray-500 text-white px-3"
      [disabled]="loading"
      severity="secondary"
      [routerLink]="['/companies']"
    />
  </div>
  }
</div>
